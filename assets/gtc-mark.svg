<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" role="img" aria-labelledby="title desc">
<title id="title">Global Tech Career official logo mark</title>
<desc id="desc">White cloud outline around three ascending blue, green and orange bars, with a turquoise upward arrow.</desc>
<defs>
 <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#1266e8"/><stop offset="1" stop-color="#25a9ff"/></linearGradient>
 <linearGradient id="green" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#009c78"/><stop offset="1" stop-color="#20d9a5"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ed4a13"/><stop offset="1" stop-color="#ffb21b"/></linearGradient>
 <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#25e4c2"/><stop offset="1" stop-color="#00b9c7"/></linearGradient>
</defs>
<!-- cloud outline -->
<path d="M23 91H18C8.6 91 2 84.1 2 75.2c0-8.2 5.6-14.5 13.5-15.6C17 45.9 28.1 35.7 42 35.7c4.2-15.8 18-26 34.1-26 16.5 0 29.5 11.5 32.1 27.7 10.4 2.2 17.8 10.9 17.8 21.3 0 11.1-8.8 20.3-20.1 20.3H98" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
<!-- rising bars -->
<rect x="27" y="55" width="18" height="33" rx="3" fill="url(#blue)"/>
<rect x="51" y="42" width="18" height="46" rx="3" fill="url(#green)"/>
<rect x="75" y="25" width="18" height="63" rx="3" fill="url(#orange)"/>
<!-- turquoise rising arrow -->
<path d="M10 101C34 103 56 99 75 88c18-10 31-25 39-45" fill="none" stroke="url(#arrow)" stroke-width="5.5" stroke-linecap="round"/>
<path d="m103 45 13-16 7 20-9-5-11 1Z" fill="#20dfc5"/>
</svg>