<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Global Tech Career bars mark</title>
<desc id="desc">Three ascending rounded bars in blue, mint green and orange gradients.</desc>
<defs>
 <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08b5f7"/><stop offset=".52" stop-color="#0865f4"/><stop offset="1" stop-color="#2114bd"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7cf0bb"/><stop offset=".55" stop-color="#19d99b"/><stop offset="1" stop-color="#008b70"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff9a18"/><stop offset=".55" stop-color="#ff6900"/><stop offset="1" stop-color="#ec310d"/></linearGradient>
</defs>
<rect x="284" y="512" width="125" height="256" rx="18" fill="url(#blue)"/>
<rect x="449" y="384" width="126" height="384" rx="18" fill="url(#green)"/>
<rect x="614" y="256" width="126" height="512" rx="18" fill="url(#orange)"/>
</svg>